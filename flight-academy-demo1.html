<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Flight Academy</title>
<style>
:root{
  --ink:#2B3A42; --ink-soft:#6C8390;
  --native:#1F6F78; --learner:#C4633F; --rec:#C2483F;
  --paper:#FBF7F1; --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;
  background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
body{height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px);
  gap:10px;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;}
button:focus-visible{outline:3px solid var(--native);outline-offset:3px;border-radius:12px;}

.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:44px;}
.back{font-size:15px;color:var(--ink-soft);padding:8px 4px;font-weight:600;min-width:64px;text-align:left;}
.title{flex:1 1 auto;text-align:center;}
.hanzi{font-size:30px;font-weight:600;line-height:1;letter-spacing:.04em;}
.pinyin{font-size:14px;color:var(--ink-soft);margin-top:3px;letter-spacing:.06em;}
.spacer{min-width:64px;}

.picker{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;}
.lead{text-align:center;padding:0 6px;}
.lead h1{font-size:27px;margin:0 0 8px;font-weight:600;letter-spacing:-.01em;}
.lead p{margin:0;color:var(--ink-soft);font-size:16px;line-height:1.5;}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:linear-gradient(160deg,#DCEAEE,var(--paper));
  border:1px solid rgba(43,58,66,.09);border-radius:var(--r);padding:15px 14px 12px;text-align:left;
  box-shadow:0 2px 10px rgba(43,58,66,.06);display:flex;flex-direction:column;gap:6px;transition:transform .1s ease;}
.card:active{transform:scale(.97);}
.card .ch{font-size:32px;font-weight:600;line-height:1;}
.card .py{font-size:14px;color:var(--ink-soft);letter-spacing:.05em;}
.card canvas{width:100%;height:32px;display:block;}

.sky{flex:1 1 auto;position:relative;min-height:150px;border-radius:22px;overflow:hidden;
  box-shadow:0 3px 18px rgba(43,58,66,.10);}
#field{display:block;width:100%;height:100%;}
.cue{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:15px;font-weight:600;
  color:var(--ink);text-shadow:0 1px 8px rgba(255,255,255,.9);pointer-events:none;opacity:0;
  transition:opacity .25s ease;letter-spacing:.02em;}
.cue.show{opacity:1;}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:84px;font-weight:600;color:rgba(43,58,66,.5);text-shadow:0 2px 22px rgba(255,255,255,.95);
  pointer-events:none;opacity:0;}
.count.show{opacity:1;}
.legend{position:absolute;left:12px;bottom:9px;display:flex;gap:14px;font-size:12px;color:var(--ink-soft);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:16px;height:3px;border-radius:2px;display:block;}

.note{flex:0 0 auto;text-align:center;font-size:14px;color:var(--ink-soft);min-height:19px;padding:0 8px;}
.main-row{flex:0 0 auto;display:flex;gap:10px;}
.big{flex:1 1 0;min-height:60px;border-radius:var(--r);background:var(--ink);color:var(--paper);
  font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .08s ease,opacity .15s ease;}
.big:active:not(:disabled){transform:scale(.975);}
.big.ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(43,58,66,.22);}
.big.record{background:var(--rec);color:#fff;}
.big:disabled{opacity:.35;}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor;}

.replay{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chip{min-height:48px;border-radius:14px;border:1.5px solid rgba(43,58,66,.16);font-size:15px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.55);}
.chip:active:not(:disabled){background:rgba(43,58,66,.06);}
.chip:disabled{opacity:.3;}
.chip .sw{width:9px;height:9px;border-radius:50%;}
.chip.wide{grid-column:1 / -1;}
.hidden{display:none !important;}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;
  box-shadow:0 6px 24px rgba(43,58,66,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:80;
  max-width:88vw;text-align:center;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div class="top">
  <button class="back hidden" id="back">‹ Tones</button>
  <div class="title">
    <div class="hanzi" id="hanzi">Flight Academy</div>
    <div class="pinyin" id="pinyin">小鸟</div>
  </div>
  <div class="spacer"></div>
</div>

<div class="picker" id="picker">
  <div class="lead">
    <h1>Tones are flight paths</h1>
    <p>Watch the bird fly the sound.<br>Then fly it yourself.</p>
  </div>
  <div class="cards" id="cards"></div>
</div>

<div class="sky hidden" id="sky">
  <canvas id="field"></canvas>
  <div class="cue" id="cue"></div>
  <div class="count" id="count"></div>
  <div class="legend hidden" id="legend">
    <span><i style="background:var(--native)"></i>The shape</span>
    <span><i style="background:var(--learner)"></i>Your flight</span>
  </div>
</div>

<div class="note hidden" id="note"></div>

<div class="main-row hidden" id="mainRow">
  <button class="big ghost" id="listenBtn">Listen</button>
  <button class="big record" id="recBtn"><span class="dot"></span>Your turn</button>
</div>

<div class="replay hidden" id="replay">
  <button class="chip" id="rNA"><span class="sw" style="background:var(--native)"></span>Teacher's voice</button>
  <button class="chip" id="rMA"><span class="sw" style="background:var(--learner)"></span>My voice</button>
  <button class="chip" id="rNP"><span class="sw" style="background:var(--native)"></span>Teacher's flight</button>
  <button class="chip" id="rMP"><span class="sw" style="background:var(--learner)"></span>My flight</button>
  <button class="chip wide" id="rB">Fly them together</button>
</div>

<div class="toast" id="toast"></div>

}
async function decode(id){
  if(buffers[id]) return buffers[id];
  const c=audio();
  buffers[id]=await new Promise((res,rej)=>{
    const p=c.decodeAudioData(b64ToBuf(ASSETS[id].wav), res, rej);
    if(p&&p.then) p.then(res,rej);
  });
  return buffers[id];
}
let srcNode=null;
function playNative(id){
  const c=audio();
  stopNative();
  const b=buffers[id]; if(!b) return c.currentTime;
  srcNode=c.createBufferSource(); srcNode.buffer=b; srcNode.connect(c.destination);
  const t0=c.currentTime+0.06; srcNode.start(t0); return t0;
}
function stopNative(){ if(srcNode){ try{srcNode.stop();}catch(e){} srcNode.disconnect(); srcNode=null; } }

/* ---------- path helpers ---------- */
function pathAt(p,t){
  if(!p.length) return null;
  t=Math.max(0,Math.min(1,t));
  let lo=0,hi=p.length-1;
  while(lo<hi-1){const m=(lo+hi)>>1; if(p[m][0]<=t) lo=m; else hi=m;}
  const a=p[lo],b=p[hi];
  if(a[1]===null) return b[1];
  if(b[1]===null) return a[1];
  const u=(t-a[0])/Math.max(1e-6,b[0]-a[0]);
  return a[1]+(b[1]-a[1])*u;
}

/* ---------- field ---------- */
const g=els.field.getContext("2d");
let W=0,H=0,DPR=1,lw=0,lh=0;
const PAD={l:30,r:30,t:36,b:38};
function sizeField(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const w=els.sky.clientWidth,h=els.sky.clientHeight;
  els.field.width=Math.round(w*DPR); els.field.height=Math.round(h*DPR);
  els.field.style.width=w+"px"; els.field.style.height=h+"px";
  W=w;H=h;lw=w;lh=h;
}
function range(){
  let lo=99,hi=-99;
  const scan=p=>p.forEach(q=>{if(q[1]!==null){lo=Math.min(lo,q[1]);hi=Math.max(hi,q[1]);}});
  if(ref) scan(ref.pts);
  if(learnerPath.length) scan(learnerPath);
  if(lo>hi){lo=-8;hi=8;}
  const mid=(lo+hi)/2, half=Math.max(5,(hi-lo)/2+2.8);
  return {lo:mid-half,hi:mid+half};
}
const X=t=>PAD.l+t*(W-PAD.l-PAD.r);
const Y=(st,r)=>PAD.t+(1-(st-r.lo)/(r.hi-r.lo))*(H-PAD.t-PAD.b);

function drawSky(){
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#A9CCE0"); gr.addColorStop(0.52,"#DCEAEE"); gr.addColorStop(1,"#F7E6D2");
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.save();
  for(let i=1;i<5;i++){
    const y=PAD.t+(H-PAD.t-PAD.b)*(i/5);
    g.globalAlpha=.10; g.strokeStyle="#2B3A42"; g.lineWidth=1; g.setLineDash([2,7]);
    g.beginPath(); g.moveTo(PAD.l-12,y); g.lineTo(W-PAD.r+12,y); g.stroke();
  }
  g.restore();
  hill(H*0.87,26,"rgba(191,212,210,.55)",0.9);
  hill(H*0.95,18,"rgba(157,188,184,.55)",1.7);
}
function hill(base,amp,fill,ph){
  g.beginPath(); g.moveTo(0,H);
  for(let x=0;x<=W;x+=8){
    const y=base-Math.sin(x/W*Math.PI*1.6+ph)*amp-Math.sin(x/W*Math.PI*4.1+ph*2)*amp*.28;
    g.lineTo(x,y);
  }
  g.lineTo(W,H); g.closePath(); g.fillStyle=fill; g.fill();
}
function route(p,r,color,alpha,dash){
  g.save(); g.globalAlpha=alpha; g.strokeStyle=color; g.lineWidth=3;
  g.lineCap="round"; g.lineJoin="round"; if(dash) g.setLineDash([7,9]);
  g.beginPath(); let pen=false;
  p.forEach(q=>{ if(q[1]===null){pen=false;return;}
    const x=X(q[0]),y=Y(q[1],r); pen?g.lineTo(x,y):(g.moveTo(x,y),pen=true); });
  g.stroke(); g.restore();
}
function trail(p,upto,r,color){
  g.save(); g.strokeStyle=color; g.lineWidth=5; g.lineCap="round"; g.lineJoin="round";
  g.shadowColor=color; g.shadowBlur=11; g.beginPath(); let pen=false;
  for(const q of p){ if(q[0]>upto) break; if(q[1]===null){pen=false;continue;}
    const x=X(q[0]),y=Y(q[1],r); pen?g.lineTo(x,y):(g.moveTo(x,y),pen=true); }
  g.stroke(); g.restore();
}
function bird(x,y,ang,color,flap,sc,idle){
  g.save(); g.translate(x,y); g.rotate(ang); g.scale(sc,sc);
  const w=idle?Math.sin(flap*0.35)*0.14:Math.sin(flap)*0.9;
  g.fillStyle=color;
  g.save(); g.rotate(-0.35+w*0.55); g.globalAlpha=.55;
  g.beginPath(); g.ellipse(-2,-3,13,5.5,-0.5,0,Math.PI*2); g.fill(); g.restore();
  g.globalAlpha=1;
  g.beginPath(); g.ellipse(0,0,13,9,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.moveTo(-10,-1); g.lineTo(-22,-6); g.lineTo(-21,3); g.closePath(); g.fill();
  g.beginPath(); g.arc(11,-5,7,0,Math.PI*2); g.fill();
  g.fillStyle="#E8A44C"; g.beginPath(); g.moveTo(17,-5); g.lineTo(25,-3.2); g.lineTo(17,-1.5); g.closePath(); g.fill();
  g.fillStyle="#FBF7F1"; g.beginPath(); g.arc(13,-7,2.4,0,Math.PI*2); g.fill();
  g.fillStyle="#2B3A42"; g.beginPath(); g.arc(13.7,-7,1.2,0,Math.PI*2); g.fill();
  g.fillStyle=color; g.save(); g.rotate(-0.2-w*0.75);
  g.beginPath(); g.ellipse(-1,-4,15,6.5,-0.45,0,Math.PI*2); g.fill(); g.restore();
  g.restore();
}
function ang(p,t,r){
  const d=0.025, a=pathAt(p,Math.max(0,t-d)), b=pathAt(p,Math.min(1,t+d));
  if(a===null||b===null) return 0;
  return Math.max(-0.95,Math.min(0.95,Math.atan2(Y(b,r)-Y(a,r),X(Math.min(1,t+d))-X(Math.max(0,t-d)))));
}

/* ---------- loop ---------- */
let flap=0;
function frame(){
  requestAnimationFrame(frame);
  if(stage==="menu") return;
  if(els.sky.clientWidth!==lw||els.sky.clientHeight!==lh) sizeField();
  flap+=0.34;
  const r=range();
  drawSky();

  const idleShow = !anim || anim.kind==="static";
  if(ref) route(ref.pts,r,"#1F6F78",idleShow?0.30:0.24,true);
  if(idleShow){
    if(learnerPath.length>1) route(learnerPath,r,"#C4633F",0.92,false);
    if(ref && stage==="done") route(ref.pts,r,"#1F6F78",0.85,false);
    if(ref && stage==="ready"){
      const st=pathAt(ref.pts,0);
      bird(X(0),Y(st,r),0,"#1F6F78",flap,1.08,true);
    }
  }

  if(stage==="recording"){
    trail(learnerPath,1,r,"#C4633F");
    const v=learnerPath.filter(p=>p[1]!==null);
    const last=v[v.length-1];
    const t=Math.min(1,(now()-anim.t0)/anim.durMs);
    if(last) bird(X(last[0]),Y(last[1],r),ang(learnerPath,last[0],r),"#C4633F",flap,1,false);
    else bird(X(t),H*0.58,0,"#C4633F",flap,1,true);
  }

  if(anim&&anim.kind==="fly"){
    const el=now()-anim.t0;
    if(anim.native){
      const lead=anim.leadMs||0, fl=anim.flightMs;
      if(el<lead){                       /* perched through the /m/ onset */
        const st=pathAt(ref.pts,0);
        bird(X(0),Y(st,r),0,"#1F6F78",flap,1.08,true);
      } else {
        const t=Math.min(1,(el-lead)/fl);
        trail(ref.pts,t,r,"#1F6F78");
        const st=pathAt(ref.pts,t);
        if(st!==null) bird(X(t),Y(st,r),ang(ref.pts,t,r),"#1F6F78",flap,1.08,t>=1);
      }
    }
    if(anim.learner&&learnerPath.length){
      const t=Math.min(1,el/anim.flightMs);
      trail(learnerPath,t,r,"#C4633F");
      const st=pathAt(learnerPath,t);
      if(st!==null) bird(X(t),Y(st,r),ang(learnerPath,t,r),"#C4633F",flap,1,t>=1);
    }
    if(el>anim.totalMs){ if(anim.onEnd) anim.onEnd(); anim={kind:"static"}; }
  }
}
const now=()=>performance.now();
requestAnimationFrame(frame);

/* ---------- cards ---------- */
function buildCards(){
  els.cards.innerHTML="";
  ORDER.forEach(id=>{
    const a=ASSETS[id];
    const b=document.createElement("button"); b.className="card";
    b.innerHTML='<div class="ch">'+a.ch+'</div><div class="py">'+a.py+'</div>';
    const cv=document.createElement("canvas"); b.appendChild(cv);
    b.onclick=()=>openTone(id);
    els.cards.appendChild(b);
    requestAnimationFrame(()=>spark(cv,a.ideal));
  });
}
function spark(cv,pts){
  const dpr=Math.min(devicePixelRatio||1,2), w=cv.clientWidth, h=32;
  cv.width=w*dpr; cv.height=h*dpr;
  const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const v=pts.filter(p=>p[1]!==null);
  const lo=Math.min(...v.map(p=>p[1]))-1.5, hi=Math.max(...v.map(p=>p[1]))+1.5;
  c.strokeStyle="#1F6F78"; c.lineWidth=2.4; c.lineCap="round"; c.lineJoin="round";
  c.beginPath(); let pen=false;
  v.forEach(p=>{ const x=2+p[0]*(w-4), y=4+(1-(p[1]-lo)/(hi-lo))*(h-8);
    pen?c.lineTo(x,y):(c.moveTo(x,y),pen=true); });
  c.stroke();
}

/* ---------- flow ---------- */
async function openTone(id){
  tone=id; const a=ASSETS[id];
  /* The bird flies the TAUGHT SHAPE, not her waveform. a.measured holds
     the real contour; it is deliberately never drawn as the guide. */
  ref={pts:a.ideal,measured:a.measured,flightMs:a.flightMs,leadMs:a.takeoffMs,eventMs:a.eventMs};
  learnerPath=[]; if(learnerAudio){URL.revokeObjectURL(learnerAudio);learnerAudio=null;}
  anim=null; stage="ready";
  els.hanzi.textContent=a.ch; els.pinyin.textContent=a.py+" · "+a.name;
  els.picker.classList.add("hidden");
  [els.sky,els.note,els.mainRow,els.replay,els.back,els.legend].forEach(e=>e.classList.remove("hidden"));
  els.note.textContent=a.hint;
  els.recBtn.innerHTML='<span class="dot"></span>Your turn';
  setChips(); sizeField();
  try{ await decode(id); }catch(e){ toast("Couldn't load the teacher's voice."); }
}
function toMenu(){
  stopAll(); stage="menu"; tone=null; ref=null; learnerPath=[]; anim=null;
  els.hanzi.textContent="Flight Academy"; els.pinyin.textContent="小鸟";
  els.picker.classList.remove("hidden");
  [els.sky,els.note,els.mainRow,els.replay,els.back,els.legend].forEach(e=>e.classList.add("hidden"));
}
els.back.onclick=toMenu;

function cue(t,ms){ els.cue.textContent=t; els.cue.classList.add("show");
  clearTimeout(cue._t); if(ms) cue._t=setTimeout(()=>els.cue.classList.remove("show"),ms); }

function flyReference(withAudio,onEnd){
  stopAll();
  const c=audio();
  const t0=withAudio?playNative(tone):c.currentTime+0.05;
  const lead=Math.max(0,(t0-c.currentTime)*1000);
  const total=withAudio?ref.eventMs+lead:ref.leadMs+ref.flightMs+120;
  cue(withAudio?"Follow the shape":"Teacher's flight",total);
  anim={kind:"fly",native:true,learner:false,t0:now()+lead,
        leadMs:ref.leadMs,flightMs:ref.flightMs,totalMs:total-lead,onEnd:onEnd};
}
els.listenBtn.onclick=()=>{ if(stage==="recording") return; flyReference(true); };

/* ---------- recording ---------- */
async function turn(){
  if(stage==="recording") return finish();
  stopAll();
  try{ await mic(); }catch(e){ toast("Microphone blocked — check permissions."); return; }
  stage="listening";
  flyReference(true,()=>countIn());
}
function countIn(){
  stage="counting"; let n=3;
  els.count.textContent=n; els.count.classList.add("show"); cue("Get ready");
  const iv=setInterval(()=>{ n--;
    if(n===0){ clearInterval(iv); els.count.classList.remove("show"); begin(); }
    else els.count.textContent=n; },620);
}
async function mic(){
  if(stream) return stream;
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  return stream;
}
let analyser=null,micSrc=null,track=null,cap=null,rid=0;

/* live pitch: decimate to ~12 kHz, YIN-style CMND, octave continuity.
   Display only — this drives the bird, nothing else. */
function makeTracker(sr){
  const dec=Math.max(1,Math.round(sr/12000)), s=sr/dec;
  const tmin=Math.floor(s/500), tmax=Math.ceil(s/70), win=tmax*2;
  const d=new Float32Array(tmax+2), cm=new Float32Array(tmax+2);
  let prev=null;
  return function(block){
    const n=Math.floor(block.length/dec); if(n<win){prev=null;return null;}
    const x=new Float32Array(win), off=n-win;
    for(let i=0;i<win;i++) x[i]=block[(off+i)*dec];
    let e=0; for(let i=0;i<win;i++) e+=x[i]*x[i];
    if(Math.sqrt(e/win)<0.006){prev=null;return null;}
    const half=win>>1;
    for(let t=tmin;t<=tmax;t++){ let s2=0;
      for(let i=0;i<half;i++){const dd=x[i]-x[i+t]; s2+=dd*dd;} d[t]=s2; }
    let run=0;
    for(let t=tmin;t<=tmax;t++){ run+=d[t]; cm[t]=d[t]*(t-tmin+1)/Math.max(1e-9,run); }
    const cands=[]; let best=-1,bv=2;
    for(let t=tmin+1;t<tmax;t++){
      if(cm[t]<cm[t-1]&&cm[t]<=cm[t+1]&&cm[t]<0.45) cands.push(t);
      if(cm[t]<bv){bv=cm[t];best=t;}
    }
    if(bv>0.45||best<0){prev=null;return null;}
    let pick=cands.find(t=>cm[t]<0.12); if(pick===undefined) pick=best;
    if(prev){
      const pt=s/prev; let bs=Infinity,bt=pick;
      for(const t of cands.concat([pick])){
        const cents=Math.abs(1200*Math.log2(t/pt));
        const sc=cm[t]+Math.min(1.2,cents/1200)*0.30;
        if(sc<bs){bs=sc;bt=t;}
      }
      pick=bt;
    }
    const a=cm[pick-1],b=cm[pick],c2=cm[pick+1],den=a-2*b+c2;
    const f0=s/(pick+(den?0.5*(a-c2)/den:0));
    if(f0<70||f0>500){prev=null;return null;}
    prev=prev?prev*0.25+f0*0.75:f0;
    return f0;
  };
}
function begin(){
  const c=audio();
  micSrc=c.createMediaStreamSource(stream);
  analyser=c.createAnalyser(); analyser.fftSize=2048; micSrc.connect(analyser);
  cap=new Float32Array(analyser.fftSize); track=makeTracker(c.sampleRate);
  chunks=[];
  try{
    const m=["audio/webm","audio/mp4"].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x));
    recorder=m?new MediaRecorder(stream,{mimeType:m}):null;
    if(recorder){
      recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      recorder.onstop=()=>{ if(chunks.length) learnerAudio=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType})); setChips(); };
      recorder.start();
    }
  }catch(e){ recorder=null; }
  learnerPath=[]; stage="recording";
  els.recBtn.innerHTML='<span class="dot"></span>Done';
  els.listenBtn.disabled=true;
  cue("Fly it yourself");
  anim={kind:"live",t0:now(),durMs:Math.max(1500,ref.flightMs*2.4)};
  const step=()=>{
    if(stage!=="recording") return;
    analyser.getFloatTimeDomainData(cap);
    const f0=track(cap);
    const t=(now()-anim.t0)/anim.durMs;
    learnerPath.push([Math.min(1,t), f0?12*Math.log2(f0/BASE_HZ):null]);
    if(t>=1) return finish();
    rid=requestAnimationFrame(step);
  };
  rid=requestAnimationFrame(step);
}
function finish(){
  if(stage!=="recording") return;
  cancelAnimationFrame(rid); stage="done";
  els.recBtn.innerHTML='<span class="dot"></span>Try again';
  els.listenBtn.disabled=false; els.cue.classList.remove("show");
  try{ recorder&&recorder.state!=="inactive"&&recorder.stop(); }catch(e){}
  if(micSrc){ micSrc.disconnect(); micSrc=null; }
  const v=learnerPath.filter(p=>p[1]!==null);
  if(v.length<6){ learnerPath=[]; anim=null; setChips();
    els.note.textContent="Didn't catch that — try again a little louder."; return; }
  const a=v[0][0], b=v[v.length-1][0];
  learnerPath=learnerPath.filter(p=>p[0]>=a&&p[0]<=b)
    .map(p=>[(p[0]-a)/Math.max(1e-6,b-a),p[1]]);
  learnerPath=med3(learnerPath);
  anim={kind:"static"}; setChips();
  els.note.textContent="Both flights are drawn. Replay either, or fly them together.";
}
function med3(p){
  return p.map((q,i)=>{
    if(q[1]===null) return q;
    const w=[p[i-1],q,p[i+1]].filter(z=>z&&z[1]!==null).map(z=>z[1]).sort((x,y)=>x-y);
    return [q[0],w[Math.floor(w.length/2)]];
  });
}
els.recBtn.onclick=turn;

/* ---------- replay ---------- */
function setChips(){
  const has=learnerPath.length>1;
  $("rMA").disabled=!learnerAudio; $("rMP").disabled=!has; $("rB").disabled=!has;
}
$("rNA").onclick=()=>{ stopAll(); playNative(tone); cue("Teacher's voice",ref.eventMs+400); };
$("rNP").onclick=()=>flyReference(false);
$("rMA").onclick=()=>{ stopAll(); playLearner(); cue("Your voice",1600); };
$("rMP").onclick=()=>{ stopAll(); cue("Your flight",ref.flightMs+400);
  anim={kind:"fly",native:false,learner:true,t0:now(),flightMs:Math.max(700,ref.flightMs),totalMs:Math.max(700,ref.flightMs)+150}; };
$("rB").onclick=()=>{ stopAll(); cue("Together",ref.flightMs+500);
  const f=Math.max(900,ref.flightMs*1.3);
  anim={kind:"fly",native:true,learner:true,t0:now(),leadMs:0,flightMs:f,totalMs:f+180}; };

let ael=null;
function playLearner(){ if(!learnerAudio) return;
  if(!ael) ael=new Audio(); ael.src=learnerAudio; ael.currentTime=0; ael.play().catch(()=>{}); }
function stopAll(){ stopNative(); if(ael) ael.pause();
  anim=(anim&&anim.kind==="static")?anim:null; }

let tt=0;
function toast(m){ els.toast.textContent=m; els.toast.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>els.toast.classList.remove("show"),2600); }
window.addEventListener("resize",()=>{ if(stage!=="menu") sizeField(); buildCards(); });
document.addEventListener("gesturestart",e=>e.preventDefault());
buildCards();
</script>
</body>
</html>
