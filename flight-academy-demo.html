<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Flight Academy</title>
<style>
:root{--ink:#2B3A42;--ink-soft:#6C8390;--paper:#FBF7F1;
 --t1:#1F6F78;--t2:#3E7D4E;--t3:#C77B2E;--t4:#B4483F;--rec:#C2483F;--r:18px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;
 background:var(--paper);color:var(--ink);
 font-family:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;}
body{height:100dvh;display:flex;flex-direction:column;
 padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px);gap:10px;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;}
button:focus-visible{outline:3px solid var(--t1);outline-offset:3px;border-radius:12px;}
.top{flex:0 0 auto;display:flex;align-items:center;min-height:42px;}
.back{font-size:15px;color:var(--ink-soft);font-weight:600;padding:8px 4px;min-width:70px;text-align:left;}
.title{flex:1 1 auto;text-align:center;font-size:15px;color:var(--ink-soft);letter-spacing:.06em;}
.spacer{min-width:70px;text-align:right;font-size:12px;color:var(--t3);font-weight:700;padding-right:4px;}
.picker{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;}
.lead{text-align:center;} .lead h1{font-size:26px;margin:0 0 8px;font-weight:600;}
.lead p{margin:0;color:var(--ink-soft);font-size:16px;line-height:1.5;}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:linear-gradient(160deg,#E3EDEF,var(--paper));border:1px solid rgba(43,58,66,.09);
 border-radius:var(--r);padding:14px;box-shadow:0 2px 10px rgba(43,58,66,.06);
 display:flex;flex-direction:column;gap:4px;transition:transform .1s ease;text-align:left;}
.card:active{transform:scale(.97);}
.card .ch{font-size:34px;font-weight:600;line-height:1.05;}
.card .py{font-size:14px;color:var(--ink-soft);}
.card canvas{width:100%;height:30px;display:block;margin-top:4px;}
.sky{flex:1 1 auto;position:relative;min-height:180px;border-radius:22px;overflow:hidden;
 box-shadow:0 3px 18px rgba(43,58,66,.10);}
#field{display:block;width:100%;height:100%;}
.cue{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:15px;font-weight:600;
 color:var(--ink);text-shadow:0 1px 8px rgba(255,255,255,.9);pointer-events:none;opacity:0;transition:opacity .25s ease;}
.cue.show{opacity:1;}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;
 font-weight:600;color:rgba(43,58,66,.45);text-shadow:0 2px 22px rgba(255,255,255,.95);pointer-events:none;opacity:0;}
.count.show{opacity:1;}
.verdict{position:absolute;left:0;right:0;top:10px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s ease;}
.verdict.show{opacity:1;}
.verdict .band{font-size:21px;font-weight:700;}
.verdict .msg{font-size:15px;margin-top:2px;text-shadow:0 1px 8px rgba(255,255,255,.9);}
.level{position:absolute;left:14px;right:14px;bottom:10px;height:4px;border-radius:3px;background:rgba(43,58,66,.12);overflow:hidden;opacity:0;transition:opacity .2s;}
.level.show{opacity:1;} .level i{display:block;height:100%;width:0;background:var(--rec);border-radius:3px;}
.hint{flex:0 0 auto;text-align:center;font-size:14px;color:var(--ink-soft);min-height:19px;}
.row{flex:0 0 auto;display:flex;gap:10px;}
.big{flex:1 1 0;min-height:60px;border-radius:var(--r);background:var(--ink);color:var(--paper);
 font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;
 transition:transform .08s ease,opacity .15s ease;}
.big:active:not(:disabled){transform:scale(.975);}
.big.ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(43,58,66,.22);}
.big.record{background:var(--rec);color:#fff;} .big:disabled{opacity:.35;}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor;}
.chips{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.chip{min-height:46px;border-radius:14px;border:1.5px solid rgba(43,58,66,.16);font-size:14px;
 font-weight:600;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);}
.chip:active:not(:disabled){background:rgba(43,58,66,.06);} .chip:disabled{opacity:.3;}
.hidden{display:none !important;}
#mumArt{position:absolute;left:10px;bottom:8px;height:26%;max-height:150px;
 pointer-events:none;opacity:0;transition:opacity .5s ease;z-index:5;filter:drop-shadow(0 3px 8px rgba(43,58,66,.22));}
#mumArt.show{opacity:1;}
.card.pair{grid-column:1 / -1;background:linear-gradient(160deg,#EDE6DC,var(--paper));}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
 background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;
 box-shadow:0 6px 24px rgba(43,58,66,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:80;max-width:88vw;text-align:center;}
.toast.show{opacity:1;}
/* dev */
.sheet{position:fixed;inset:0;background:rgba(43,58,66,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
.sheet-in{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;
 padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:14px;max-height:88dvh;overflow:auto;}
.sheet h2{margin:0;font-size:19px;} .sheet .lab{font-size:13px;color:var(--ink-soft);font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
.sheet .val{font-size:15px;font-weight:700;float:right;color:var(--ink);}
input[type=range]{width:100%;height:38px;}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.seg button{min-height:46px;border-radius:12px;border:1.5px solid rgba(43,58,66,.18);font-size:14px;font-weight:600;background:rgba(255,255,255,.6);}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.dbg{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;color:var(--ink-soft);
 background:rgba(43,58,66,.05);border-radius:12px;padding:10px;white-space:pre-wrap;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div class="top">
  <button class="back hidden" id="back">‹ Tones</button>
  <div class="title" id="title">Flight Academy · 小鸟</div>
  <div class="spacer" id="devTag"></div>
</div>

<div class="picker" id="picker">
  <div class="lead"><h1>Every character has a flight path</h1><p>Listen to the tone. Fly your bird.</p></div>
  <div class="cards" id="cards"></div>
</div>

<div class="sky hidden" id="sky">
  <canvas id="field"></canvas>
  <div class="cue" id="cue"></div>
  <div class="count" id="count"></div>
  <div class="verdict" id="verdict"><div class="band" id="vband"></div><div class="msg" id="vmsg"></div></div>
  <div class="level" id="level"><i id="levelBar"></i></div>
</div>

<div class="hint hidden" id="hint"></div>
<div class="row hidden" id="mainRow">
  <button class="big ghost" id="listenBtn">Listen</button>
  <button class="big record" id="recBtn"><span class="dot"></span>Your turn</button>
</div>
<div class="chips hidden" id="chips">
  <button class="chip" id="cTeacher">Teacher</button>
  <button class="chip" id="cMine">My voice</button>
  <button class="chip" id="cFlight">My flight</button>
</div>

<img id="mumArt" alt="" src="">
<div class="toast" id="toast"></div>

const LEGACY_VETO_MSG={1:"That sounded like a different tone.",2:"That sounded like a different tone.",
                3:"That sounded like a different tone.",4:"That sounded like a different tone."};

/* tunables — the two live ones are exposed in dev mode, the rest are

  gateDb:6,            /* dB above the measured room floor  (LIVE)   */
  silenceMs:700,       /* pause that ends the attempt       (LIVE)   */
  maxMs:6000,
  headTrimMs:90,       /* attack only. tail trim is now ZERO         */
  tailTrimMs:0,
  f0Min:55, f0Max:450,
  clarity:0.60,
  bridgeMs:280,
  coachFloor:25,       /* target evidence needed before we coach rather than veto */
  vetoSoft:15,         /* another tone better by this -> cap 59      */
  vetoHard:30,         /* ... by this -> cap 24                      */
  t1RangeFree:1.5, t1RangeSpan:3.5,
  t3Fall:3.0, t3Recover:1.0, t3MinLo:0.06, t3MinHi:0.70,   /* tone-3 evidence */
  ampFloor:0.8, ampSpan:2.2,
  corrOff:0.15, corrSpan:0.95
};

let id=null,tone=1,ideal=null,stage="menu",anim=null,result=null;
let EX=null,route=null;
let ctx=null,stream=null,learnerAudio=null;
const buffers={};
let dev=false, intended="correct", capture=[], lastDebug="";

const $=x=>document.getElementById(x);
const els={picker:$("picker"),cards:$("cards"),sky:$("sky"),field:$("field"),cue:$("cue"),count:$("count"),
 hint:$("hint"),mainRow:$("mainRow"),listenBtn:$("listenBtn"),recBtn:$("recBtn"),chips:$("chips"),
 back:$("back"),title:$("title"),toast:$("toast"),verdict:$("verdict"),vband:$("vband"),vmsg:$("vmsg"),
 level:$("level"),levelBar:$("levelBar"),devTag:$("devTag"),mumArt:$("mumArt")};

/* ---------------- audio ---------------- */
function audio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended") ctx.resume(); return ctx; }
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;}
async function decode(k){ if(buffers[k]) return buffers[k]; const c=audio();
  buffers[k]=await new Promise((res,rej)=>{const p=c.decodeAudioData(b64(ASSETS[k].wav),res,rej); if(p&&p.then)p.then(res,rej);});
  return buffers[k]; }
let src=null;
function playNative(){ const c=audio(); stopNative(); const b=buffers[id]; if(!b) return c.currentTime;
  src=c.createBufferSource(); src.buffer=b; src.connect(c.destination);
  const t=c.currentTime+0.06; src.start(t); return t; }
function stopNative(){ if(src){try{src.stop();}catch(e){} src.disconnect(); src=null;} }

/* ---------------- geometry / drawing ---------------- */
const g=els.field.getContext("2d");
let W=0,H=0,DPR=1,lw=0,lh=0,flap=0;
function sizeField(){ DPR=Math.min(devicePixelRatio||1,2);
  const w=els.sky.clientWidth,h=els.sky.clientHeight;
  els.field.width=Math.round(w*DPR); els.field.height=Math.round(h*DPR);
  els.field.style.width=w+"px"; els.field.style.height=h+"px"; W=w;H=h;lw=w;lh=h; }
function lane(){ return {L:W*0.13,R:W*0.87,T:H*0.17,B:H*0.50,charSize:Math.min(W*0.40,H*0.30),charY:H*0.74}; }
function span(){ return routeSpan(route); }
const PX=(t,l)=>l.L+t*(l.R-l.L);
const PY=(v,l,s)=>l.T+(1-(v-s.lo)/(s.hi-s.lo))*(l.B-l.T);
function at(p,t){ t=Math.max(0,Math.min(1,t));
  for(let i=0;i<p.length-1;i++) if(t<=p[i+1][0]){
    const u=(t-p[i][0])/Math.max(1e-6,p[i+1][0]-p[i][0]); return p[i][1]+(p[i+1][1]-p[i][1])*u; }
  return p[p.length-1][1]; }
/* ==================================================================
   THE TWO-BIRD ENGINE

   花花 flies first. She demonstrates, she sets the pace, she is always
   calm and always confident. 小花花 follows a beat behind and performs
   what the learner just produced. The distance between them is the
   feedback — no legend, no explanation.

   A ROUTE is a chain of FIGURES joined by LINKS. A link is the skater's
   connecting edge: the release of one figure becomes the gather of the
   next, so the bird never stops between syllables. One figure today or
   eight tomorrow, the engine is the same.
   ================================================================== */

const TEMPO={
  0:[[0,0],[0.5,0.55],[1,1]],                           /* neutral: light, quick */
  1:[[0,0],[0.14,0.12],[0.86,0.88],[1,1]],              /* calm, unhurried    */
  2:[[0,0],[0.34,0.17],[0.70,0.62],[1,1]],              /* gather, lift, release */
  3:[[0,0],[0.35,0.30],[0.70,0.60],[1,1]],              /* sink, pause, recover */
  4:[[0,0],[0.22,0.06],[0.55,0.44],[0.82,0.93],[1,1]]   /* commit, dive, finish */
};
/* four performances of the same dance — never four different dances */
const PERF=[
 {amp:1.00,character:1.00,sag:0.00,unsteady:0.00,effort:1.00,flourish:1.00,
  lagMs:240,gapSt:0.0,down:0,ink:{w:5.0,a:1.00,glow:true ,dash:null}},
 {amp:0.93,character:0.86,sag:0.05,unsteady:0.05,effort:1.25,flourish:0.55,
  lagMs:340,gapSt:0.5,down:2,ink:{w:4.4,a:0.92,glow:false,dash:null}},
 {amp:0.79,character:0.60,sag:0.16,unsteady:0.16,effort:1.70,flourish:0.20,
  lagMs:470,gapSt:1.2,down:5,ink:{w:3.6,a:0.80,glow:false,dash:[13,5]}},
 {amp:0.58,character:0.36,sag:0.32,unsteady:0.30,effort:2.20,flourish:0.00,
  lagMs:620,gapSt:2.1,down:9,ink:{w:3.1,a:0.68,glow:false,dash:[9,7]}}
];
const LEAD_MS=300, TAIL_MS=460;

/* ---- routes ---- */
function toneRoute(k,shape,ms){ return {segs:[{kind:"fig",tone:k,ms:ms,pts:shape}]}; }
function pairRoute(p){ return {segs:p.segs.map(x=>Object.assign({},x))}; }
function routeSpan(r){
  let lo=99,hi=-99;
  for(const g of r.segs) if(g.pts) for(const q of g.pts){ lo=Math.min(lo,q[1]); hi=Math.max(hi,q[1]); }
  if(lo>hi){lo=-4;hi=4;}
  const pad=Math.max(1.4,(hi-lo)*0.24);
  return {lo:lo-pad,hi:hi+pad};
}
function routeMs(r){ return r.segs.reduce((s,g)=>s+g.ms,0); }

/* ---- the choreographer ---- */
function choreograph(route,band,seed){
  const B=PERF[band];
  const slow=1+(1-B.character)*0.55;          /* a hesitant flight takes longer */
  const segs=[]; let t=0,x=0; const totalRaw=routeMs(route);
  for(let i=0;i<route.segs.length;i++){
    const g=route.segs[i], ms=g.ms*slow, w=g.ms/totalRaw;
    segs.push({g:g,t0:t,t1:t+ms,x0:x,x1:x+w,i:i}); t+=ms; x+=w;
  }
  const figMs=t, total=LEAD_MS+figMs+TAIL_MS;
  const first=segs.find(s=>s.g.pts), last=[...segs].reverse().find(s=>s.g.pts);
  const h0=at(first.g.pts,0), hEnd=at(last.g.pts,1);
  const swing=Math.max(2.5,Math.abs(hEnd-h0));

  const feathers=[];
  for(let i=0;i<B.down;i++)
    feathers.push({u:0.15+0.72*((i+0.4)/Math.max(1,B.down))+0.04*Math.sin(seed+i*3.1),
                   dx:(Math.sin(seed*3+i*2.7))*0.9, spin:(i%2?1:-1),
                   rise:0.5+0.5*Math.abs(Math.sin(seed+i))});

  /* height and local progress anywhere along the route */
  function shapeAt(ms){
    const gm=Math.max(0,Math.min(figMs-0.001,ms));
    let s=segs[0]; for(const q of segs) if(gm>=q.t0) s=q;
    const u=(gm-s.t0)/Math.max(1e-6,s.t1-s.t0);
    if(s.g.kind==="link"){
      const prev=segs[s.i-1], next=segs[s.i+1];
      const from=prev?at(prev.g.pts,1):h0, to=next?at(next.g.pts,0):hEnd;
      const e=u*u*(3-2*u);                                   /* the connecting edge */
      return {st:from+(to-from)*e, x:s.x0+(s.x1-s.x0)*u, link:true, tone:null};
    }
    const tempo=TEMPO[s.g.tone]||TEMPO[1];
    let p=at(tempo,u)*B.character+u*(1-B.character);
    p-=Math.sin(Math.PI*u)*0.10*(1-B.character);             /* a stall when unsure */
    p=Math.max(0,Math.min(1,p));
    const base=at(s.g.pts,0);
    let st=base+(at(s.g.pts,p)-base)*B.amp;
    return {st:st, x:s.x0+(s.x1-s.x0)*p, link:false, tone:s.g.tone};
  }
  function body(ms){
    const gm=Math.max(0,Math.min(figMs,ms)), u=gm/figMs;
    const c=shapeAt(gm);
    let st=c.st-B.sag*u*2.6;
    if(B.unsteady) st+=(Math.sin(u*Math.PI*2.3+seed)*0.6+Math.sin(u*Math.PI*3.7+seed*2.1)*0.4)
                       *B.unsteady*swing*0.26;
    return {st:st,x:c.x,link:c.link};
  }

  return {
    total:total, figMs:figMs, band:band, feathers:feathers, B:B, swing:swing,
    endSt:body(figMs).st,
    at(ms){
      if(ms<LEAD_MS){                                        /* gather and set */
        const u=ms/LEAD_MS;
        return {x:0,st:h0-Math.sin(u*Math.PI)*0.5*B.character,vy:0,stage:"lead",u:0,
                spread:0.5+0.45*u,tuck:0,effort:0.25,link:false};
      }
      if(ms<LEAD_MS+figMs){
        const m=ms-LEAD_MS, cur=body(m), d=Math.max(6,figMs*0.012);
        const vy=(body(Math.min(figMs,m+d)).st-body(Math.max(0,m-d)).st)/(2*d/1000);
        const up=Math.max(0,vy), dn=Math.max(0,-vy);
        return {x:cur.x,st:cur.st,vy:vy,stage:"figure",u:m/figMs,link:cur.link,
                spread:cur.link?1.05:Math.min(1.3,0.75+up*0.045),   /* links are glides */
                tuck:cur.link?0:Math.min(1,dn*0.055),
                effort:(cur.link?0.2:(0.35+up*0.05))*B.effort};
      }
      const u=(ms-LEAD_MS-figMs)/TAIL_MS, e=1-Math.pow(1-u,3);
      const lift=B.flourish*0.9*Math.sin(Math.min(1,u*1.4)*Math.PI)-(1-B.flourish)*1.5*e;
      return {x:1,st:this.endSt+lift,vy:0,stage:"tail",u:u,link:false,
              spread:0.72+B.flourish*0.5*(1-e),tuck:0,effort:0.3*B.effort};
    }
  };
}

/* ---------------- painting ---------------- */
function sky(){ g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#AFD0E2"); gr.addColorStop(.5,"#DFECEF"); gr.addColorStop(1,"#F8E8D5");
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  ridge(H*.83,24,"rgba(186,208,206,.5)",.9); ridge(H*.93,17,"rgba(152,184,180,.5)",1.8); }
function ridge(base,amp,fill,ph){ g.beginPath(); g.moveTo(0,H);
  for(let x=0;x<=W;x+=8) g.lineTo(x,base-Math.sin(x/W*Math.PI*1.6+ph)*amp-Math.sin(x/W*Math.PI*4.1+ph*2)*amp*.28);
  g.lineTo(W,H); g.closePath(); g.fillStyle=fill; g.fill(); }
function character(l){ g.save();
  const txt=EX.ch, n=txt.length;
  const size=n>1?l.charSize*0.72:l.charSize;
  g.font='600 '+size+'px "PingFang SC","Hiragino Sans GB","Songti SC",serif';
  g.textAlign="center"; g.textBaseline="middle"; g.fillStyle="rgba(43,58,66,.88)";
  g.fillText(txt,W/2,l.charY); g.restore(); }
function guide(l,s){
  /* 花花's route — always visible, always the same shape */
  g.save(); g.strokeStyle="#1F6F78"; g.globalAlpha=.26; g.lineWidth=2.5;
  g.setLineDash([6,8]); g.lineCap="round"; g.beginPath();
  const r=teacherPerf; if(!r){ g.restore(); return; }
  for(let i=0;i<=80;i++){ const p=r.at(LEAD_MS+(i/80)*r.figMs);
    const x=PX(p.x,l),y=PY(p.st,l,s); i?g.lineTo(x,y):g.moveTo(x,y); }
  g.stroke(); g.restore();
}

/* the ribbon 小花花 leaves — the shape never changes, only the quality */
function ribbon(perf,ms,l,s,c){
  const ink=perf.B.ink, N=90;
  g.save(); g.strokeStyle=c; g.lineWidth=ink.w; g.globalAlpha=ink.a;
  g.lineCap="round"; g.lineJoin="round";
  if(ink.dash) g.setLineDash(ink.dash);
  if(ink.glow){ g.shadowColor=c; g.shadowBlur=14; }
  g.beginPath(); let pen=false;
  const end=Math.min(ms,LEAD_MS+perf.figMs);
  for(let i=0;i<=N;i++){
    const t=LEAD_MS+(end-LEAD_MS)*(i/N); if(t<LEAD_MS) continue;
    const p=perf.at(t), x=PX(p.x,l), y=PY(p.st,l,s);
    pen?g.lineTo(x,y):(g.moveTo(x,y),pen=true);
  }
  g.stroke(); g.restore();
}

/* ---------------- the birds ----------------
   Drawn rather than sprited so they can bank, tuck and beat. Styled from
   the artwork: cream body, navy beret with a blossom, navy waistcoat. */
let beat=0;
function flyer(x,y,bank,st,who){
  const mum = who==="mum";
  const spread=st.spread==null?1:st.spread, tuck=st.tuck||0;
  const sc=(mum?1.18:0.92)*(st.scale||1);
  const bob=Math.cos(beat*(mum?0.8:1.15))*(mum?1.2:2.2)*(1-tuck);
  g.save(); g.translate(x,y+bob); g.rotate(bank); g.scale(sc,sc);
  const w=Math.sin(beat*(mum?0.75:1.15))*(1-tuck)*(mum?0.55:1.0);
  const reach=(0.6+0.7*spread)*(1-tuck*0.5);
  const CREAM="#F6EFE2", NAVY="#3E4C63", GOLD="#E8A44C", INK="#2B3A42", BLOSSOM="#F2B8C6";

  /* far wing */
  g.save(); g.rotate(-0.3+w*0.5+tuck*0.5); g.globalAlpha=.55;
  g.fillStyle=CREAM; g.beginPath(); g.ellipse(-2,-3,12*reach,5*(1-tuck*0.4),-.5,0,7); g.fill(); g.restore();
  g.globalAlpha=1;
  /* body + waistcoat */
  g.fillStyle=CREAM; g.beginPath(); g.ellipse(0,0,12,9,0,0,7); g.fill();
  g.fillStyle=NAVY; g.beginPath(); g.ellipse(-1,2.5,8.5,5.5,0,0,7); g.fill();
  /* tail */
  const fan=1+(st.stage==="tail"?0.45:0)+tuck*0.3;
  g.beginPath(); g.moveTo(-9,-1); g.lineTo(-20-4*fan,-6*fan); g.lineTo(-19-4*fan,3*fan); g.closePath(); g.fill();
  /* head */
  g.fillStyle=CREAM; g.beginPath(); g.arc(10,-5.5,6.8,0,7); g.fill();
  /* beret + blossom */
  g.fillStyle=NAVY; g.beginPath(); g.ellipse(9.5,-11,7.2,3.6,-0.18,0,7); g.fill();
  g.beginPath(); g.arc(14.5,-13.2,1.5,0,7); g.fill();
  g.fillStyle=BLOSSOM; g.beginPath(); g.arc(6,-11.8,1.9,0,7); g.fill();
  /* beak, eye */
  g.fillStyle=GOLD; g.beginPath(); g.moveTo(16.4,-5.4); g.lineTo(23.5,-3.6); g.lineTo(16.4,-2); g.closePath(); g.fill();
  g.fillStyle="#FFFFFF"; g.beginPath(); g.arc(12.4,-7,2.5,0,7); g.fill();
  g.fillStyle=INK; g.beginPath(); g.arc(13.1,-7,1.35,0,7); g.fill();
  if(mum){ g.strokeStyle="#C9A24B"; g.lineWidth=0.9; g.beginPath(); g.arc(12.6,-7,3.5,0,7); g.stroke(); }
  else { /* a wisp of fledgling down */
    g.strokeStyle=CREAM; g.lineWidth=1.4; g.beginPath();
    g.moveTo(6,-13.5); g.quadraticCurveTo(4,-17.5,7,-18.5); g.stroke(); }
  /* near wing */
  g.fillStyle=CREAM; g.save(); g.rotate(-0.16-w*0.8+tuck*0.55);
  g.beginPath(); g.ellipse(-1,-4,14*reach,6.2*(1-tuck*0.4),-.45,0,7); g.fill();
  g.fillStyle=NAVY; g.beginPath(); g.ellipse(-11*reach,-5.5,4*reach,2.6,-.45,0,7); g.fill(); g.restore();
  g.restore();
}
/* soft down shaken loose by enthusiastic flapping — effort, never damage */
function down(x,y,rot,a,scale){
  g.save(); g.translate(x,y); g.rotate(rot); g.globalAlpha=a*0.85; g.scale(scale,scale);
  g.fillStyle="#FBF6EC"; g.beginPath(); g.ellipse(0,0,5.5,2.4,0,0,7); g.fill();
  g.globalAlpha=a*0.5; g.strokeStyle="#E6DBC7"; g.lineWidth=0.8;
  g.beginPath(); g.moveTo(-5,0); g.lineTo(5,0); g.stroke(); g.restore();
}
function sparkle(x,y,t){ g.save();
  for(let i=0;i<3;i++){ const ang=t*4+i*2.1,r=14+i*6;
    g.fillStyle="rgba(255,228,160,"+(.7-i*.2)+")";
    g.beginPath(); g.arc(x-Math.cos(ang)*r*.6-17,y+Math.sin(ang)*r*.5,2.4-i*.5,0,7); g.fill(); }
  g.restore(); }
function bankOf(p,l,s){
  const k=(l.B-l.T)/Math.max(1e-6,(s.hi-s.lo));
  return Math.max(-1.0,Math.min(1.0,-p.vy*k/((l.R-l.L)/1.1)*1.05));
}

/* ---------------- loop ---------------- */
let teacherPerf=null;
function frame(){ requestAnimationFrame(frame);
  if(stage==="menu") return;
  if(els.sky.clientWidth!==lw||els.sky.clientHeight!==lh) sizeField();
  const l=lane(),s=span();
  beat+=0.13;
  sky(); character(l); guide(l,s);

  if(!anim){ const p=teacherPerf.at(0);
    flyer(PX(0,l),PY(p.st,l,s),0,{spread:0.55,stage:"idle",effort:.3},"mum");
    return; }

  const el=performance.now()-anim.t0;
  if(el<0){ const p=teacherPerf.at(0);
    flyer(PX(0,l),PY(p.st,l,s),0,{spread:0.55,stage:"idle",effort:.3},"mum"); return; }

  /* ---- 花花 leads ---- */
  const T=anim.teacher, tp=T.at(Math.min(el,T.total));
  let tx=PX(tp.x,l), ty=PY(tp.st,l,s), tb=bankOf(tp,l,s);
  if(anim.child && el>T.total){
    /* she has arrived and her daughter has not — she waits and circles.
       She never looks back in disappointment; she simply holds the air. */
    const w=(el-T.total)/1000;
    tx+=Math.cos(w*2.0)*13; ty+=Math.sin(w*2.0)*9;
    tb=Math.sin(w*2.0)*0.35;
  }

  /* ---- 小花花 follows ---- */
  if(anim.child){
    const C=anim.child, ce=el-C.lag;
    if(ce>0){
      const cp=C.perf.at(Math.min(ce,C.perf.total));
      const cst=cp.st-C.gap;
      ribbon(C.perf,Math.min(ce,C.perf.total),l,s,C.color);
      if(C.perf.band===0&&cp.stage==="figure") sparkle(PX(cp.x,l),PY(cst,l,s),ce/1000);
      for(const f of C.perf.feathers){
        const born=LEAD_MS+f.u*C.perf.figMs, age=(ce-born)/1000;
        if(age>0&&age<2.2){ const bp=C.perf.at(born), a=Math.max(0,1-age*0.55);
          down(PX(bp.x,l)+f.dx*26*age, PY(bp.st-C.gap,l,s)-f.rise*14*age+30*age*age,
               f.spin*age*1.6, a, 0.85+0.3*f.rise); }
      }
      flyer(PX(cp.x,l),PY(cst,l,s),bankOf(cp,l,s),cp,"kid");
    } else {
      const p0=C.perf.at(0);
      flyer(PX(0,l),PY(p0.st-C.gap,l,s),0,{spread:0.5,stage:"idle",effort:.3},"kid");
    }
  }
  flyer(tx,ty,tb,tp,"mum");

  const done=anim.child?Math.max(T.total,anim.child.lag+anim.child.perf.total):T.total;
  if(el>done+(anim.holdMs||500)){ if(anim.onEnd) anim.onEnd(); anim=null; }
}
requestAnimationFrame(frame);

/* ---------------- menu ---------------- */
function cards(){ els.cards.innerHTML="";
  ORDER.forEach(k=>{ const a=ASSETS[k],n=TONE_N[k];
    const b=document.createElement("button"); b.className="card";
    b.innerHTML='<div class="ch">'+a.ch+'</div><div class="py">'+a.py+' · Tone '+n+'</div>';
    const cv=document.createElement("canvas"); b.appendChild(cv);
    b.onclick=()=>openEx(k); els.cards.appendChild(b);
    requestAnimationFrame(()=>mini(cv,a.ideal,HUE[n])); });
  const b=document.createElement("button"); b.className="card pair";
  b.innerHTML='<div class="ch">'+PAIR.ch+'</div><div class="py">'+PAIR.py+' · Two syllables</div>';
  const cv=document.createElement("canvas"); b.appendChild(cv);
  b.onclick=()=>openEx("PAIR"); els.cards.appendChild(b);
  requestAnimationFrame(()=>{ const r=pairRoute(PAIR), pf=choreograph(r,0,1.7), pts=[];
    for(let i=0;i<=44;i++){ const p=pf.at(LEAD_MS+(i/44)*pf.figMs); pts.push([p.x,p.st]); }
    mini(cv,pts,HUE[1]); }); }
function mini(cv,pts,c){ const d=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=30;
  cv.width=w*d; cv.height=h*d; const x=cv.getContext("2d"); x.scale(d,d);
  const v=pts.map(p=>p[1]),lo=Math.min(...v)-1,hi=Math.max(...v)+1;
  x.strokeStyle=c; x.lineWidth=2.6; x.lineCap="round"; x.beginPath();
  for(let i=0;i<=40;i++){const t=i/40; const px=2+t*(w-4),py=4+(1-(at(pts,t)-lo)/(hi-lo))*(h-8); i?x.lineTo(px,py):x.moveTo(px,py);}
  x.stroke(); }

/* ==================================================================
   Capture — full PCM, so the WAV we save is exactly what we judged
   ================================================================== */
let capNode=null,micNode=null,pcm=[],pcmLen=0,attemptStart=0,recSR=48000;
const WORKLET='class C extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(new Float32Array(c));return true}}registerProcessor("cap",C)';

async function getMic(){ if(stream) return stream;
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  return stream; }
async function startCapture(){
  const c=audio(); recSR=c.sampleRate; pcm=[]; pcmLen=0;
  micNode=c.createMediaStreamSource(stream);
  try{
    if(!c._capReady){ await c.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:"application/javascript"}))); c._capReady=true; }
    capNode=new AudioWorkletNode(c,"cap");
    capNode.port.onmessage=e=>{ pcm.push(e.data); pcmLen+=e.data.length; };
  }catch(err){
    capNode=c.createScriptProcessor(2048,1,1);
    capNode.onaudioprocess=e=>{ const d=new Float32Array(e.inputBuffer.getChannelData(0)); pcm.push(d); pcmLen+=d.length; };
    capNode.connect(c.destination);
  }
  micNode.connect(capNode);
}
function stopCapture(){ if(micNode){micNode.disconnect();micNode=null;}
  if(capNode){ try{capNode.disconnect();}catch(e){} capNode=null; } }
function flat(from,to){ const out=new Float32Array(Math.max(0,to-from)); let i=0,pos=0;
  for(const ch of pcm){ for(let j=0;j<ch.length;j++,pos++){ if(pos>=from&&pos<to) out[i++]=ch[j]; } }
  return out; }
function rmsOf(a){ let e=0; for(let i=0;i<a.length;i++) e+=a[i]*a[i]; return Math.sqrt(e/Math.max(1,a.length)); }
function toWav(f32,sr){ const n=f32.length,buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF"); dv.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,"data"); dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,f32[i])); dv.setInt16(44+i*2,s<0?s*32768:s*32767,true); }
  return buf; }

/* ==================================================================
   Pitch tracking + analysis  (offline, over the captured PCM)
   ================================================================== */
function trackOffline(x,sr,floor){
  const dec=Math.max(1,Math.round(sr/12000)), s=sr/dec;
  const tmin=Math.floor(s/CFG.f0Max), tmax=Math.ceil(s/CFG.f0Min), win=tmax*2;
  const need=win*dec, hop=Math.round(sr*0.010);
  const gate=floor*Math.pow(10,CFG.gateDb/20);
  const d=new Float32Array(tmax+2), cm=new Float32Array(tmax+2), out=[];
  for(let p=0;p+need<x.length;p+=hop){
    const seg=x.subarray(p,p+need);
    if(rmsOf(seg)<Math.max(gate,0.0012)){ out.push({t:p/sr*1000,f0:null}); continue; }
    const b=new Float32Array(win);
    for(let i=0;i<win;i++) b[i]=seg[i*dec];
    const half=win>>1;
    for(let t=tmin;t<=tmax;t++){ let a=0; for(let i=0;i<half;i++){const q=b[i]-b[i+t]; a+=q*q;} d[t]=a; }
    let run=0; for(let t=tmin;t<=tmax;t++){ run+=d[t]; cm[t]=d[t]*(t-tmin+1)/Math.max(1e-9,run); }
    let best=-1,bv=2; for(let t=tmin+1;t<tmax;t++) if(cm[t]<bv){bv=cm[t];best=t;}
    if(bv>CFG.clarity||best<0){ out.push({t:p/sr*1000,f0:null}); continue; }
    const a1=cm[best-1],b1=cm[best],c1=cm[best+1],den=a1-2*b1+c1;
    const f0=s/(best+(den?0.5*(a1-c1)/den:0));
    out.push({t:p/sr*1000,f0:(f0>=CFG.f0Min&&f0<=CFG.f0Max)?f0:null});
  }
  return out;
}

function analyse(raw){
  let v=raw.filter(p=>p.f0); if(v.length<8) return null;
  /* octaves resolved globally against a robust centre, never the first frame */
  const so=v.map(p=>p.f0).slice().sort((a,b)=>a-b);
  let est=so[so.length>>1]; const fixed=[];
  for(const p of v){
    const c=[p.f0/2,p.f0,p.f0*2].reduce((m,x)=>Math.abs(Math.log2(x/est))<Math.abs(Math.log2(m/est))?x:m);
    if(Math.abs(12*Math.log2(c/est))>8) continue;
    est=est*.75+c*.25; fixed.push({t:p.t,f0:c}); }
  if(fixed.length<8) return null;
  /* bridge short unvoiced gaps: a creaky third-tone bottom is part of the syllable */
  const br=[];
  for(let i=0;i<fixed.length;i++){ br.push(fixed[i]);
    if(i+1<fixed.length){ const gap=fixed[i+1].t-fixed[i].t;
      if(gap>20&&gap<=CFG.bridgeMs){ const n=Math.round(gap/10);
        for(let j=1;j<n;j++){ const u=j/n;
          br.push({t:fixed[i].t+gap*u,f0:Math.pow(2,Math.log2(fixed[i].f0)*(1-u)+Math.log2(fixed[i+1].f0)*u)}); } } } }
  let bA=0,bB=0,a=0;
  for(let i=1;i<=br.length;i++) if(i===br.length||br[i].t-br[i-1].t>CFG.bridgeMs){ if(i-a>bB-bA){bA=a;bB=i;} a=i; }
  const run=br.slice(bA,bB); if(run.length<8) return null;
  /* attack trimmed. TAIL IS KEPT — the fall is a fourth tone's quietest part */
  const t0=run[0].t,t1=run[run.length-1].t,len=t1-t0;
  const head=Math.min(CFG.headTrimMs,len*0.22);
  const core=run.filter(p=>p.t>=t0+head&&p.t<=t1-CFG.tailTrimMs);
  if(core.length<6||len<140) return null;
  const cs=core.map(p=>p.f0).slice().sort((a,b)=>a-b), med=cs[cs.length>>1];
  const st=core.map(p=>({t:(p.t-core[0].t)/Math.max(1,core[core.length-1].t-core[0].t),v:12*Math.log2(p.f0/med)}));
  const N=24,c2=[];
  for(let i=0;i<N;i++){ const t=i/(N-1); let lo=0;
    while(lo<st.length-2&&st[lo+1].t<t) lo++;
    const p=st[lo],q=st[Math.min(st.length-1,lo+1)],u=(t-p.t)/Math.max(1e-6,q.t-p.t);
    c2.push(p.v+(q.v-p.v)*Math.max(0,Math.min(1,u))); }
  const sm=c2.map((_,i)=>{ const w=c2.slice(Math.max(0,i-1),i+2); return w.reduce((x,y)=>x+y,0)/w.length; });
  return {c:sm,durMs:len,frames:core.length,baselineHz:Math.round(med*10)/10,
          coverage:Math.round(100*v.length/Math.max(1,raw.length))};
}

/* ---------- ONE scoring rule for all four tones ----------
   Every tone is judged by the same two quantities: how much the pitch
   moved, and how well that movement correlates with the tone's shape.
   Tone 1 is the case where "not moving" is the correct answer, so it
   reads the same movement measure with the sign reversed. This is what
   puts the four scores on a comparable scale. */
const TMPL={ 2:t=>-1+2*t, 4:t=>1-2*t };   /* tone 3 no longer uses a template */
const clamp01=x=>Math.max(0,Math.min(1,x));
function corr(a,b){ const n=a.length;
  const ma=a.reduce((x,y)=>x+y,0)/n, mb=b.reduce((x,y)=>x+y,0)/n;
  let sa=0,sb=0,sab=0;
  for(let i=0;i<n;i++){ const da=a[i]-ma,db=b[i]-mb; sa+=da*da; sb+=db*db; sab+=da*db; }
  return (sa<1e-9||sb<1e-9)?0:sab/Math.sqrt(sa*sb); }

/* explicit tone-3 evidence: a descent, a low point genuinely inside the
   syllable, and a recovery afterwards. Deliberately NOT judged by net
   movement — a third tone may finish above or below where it began. */
function features(c){
  const n=c.length;
  const early=(c[0]+c[1]+c[2]+c[3])/4, late=(c[n-1]+c[n-2]+c[n-3]+c[n-4])/4;
  /* Search for the low point INSIDE the syllable. A creaky or decaying tail
     can drag the global minimum to the final frame, which used to fail the
     interiority test and reject an otherwise good third tone. */
  const lo=Math.round(0.06*(n-1)), hi=Math.round(0.78*(n-1));
  let mi=lo; for(let i=lo+1;i<=hi;i++) if(c[i]<c[mi]) mi=i;
  const s=c.slice().sort((a,b)=>a-b);
  return { early:early, late:late, min:c[mi], minPos:mi/(n-1),
           range:s[Math.round(n*0.9)]-s[Math.round(n*0.1)],
           earlyFall:early-c[mi], recovery:late-c[mi], net:late-early };
}
function fitAll(c){
  const f=features(c), n=c.length, fit={};
  fit[1]=100*clamp01(1-(f.range-CFG.t1RangeFree)/CFG.t1RangeSpan);
  const amp=clamp01((f.range-CFG.ampFloor)/CFG.ampSpan);
  for(const k of [2,4]){
    const tm=[]; for(let i=0;i<n;i++) tm.push(TMPL[k](i/(n-1)));
    fit[k]=100*clamp01((corr(c,tm)+CFG.corrOff)/CFG.corrSpan)*amp;
  }
  const interior=clamp01((f.minPos-CFG.t3MinLo)/0.10)*clamp01((CFG.t3MinHi-f.minPos)/0.12);
  fit[3]=100*clamp01(f.earlyFall/CFG.t3Fall)*interior*clamp01(f.recovery/CFG.t3Recover);
  return {fit:fit,f:f};
}

/* Tone 2 and Tone 3 are acoustic neighbours. When one beats the other we
   coach instead of rejecting; distant tones still get a firm veto. */
const NEIGHBOURS={"2-3":1,"3-2":1};
const COACH={"3-2":"Almost — dip lower before you rise.",
             "2-3":"Good rise — start the climb more directly.",
             "3-4":"Almost — let it come back up at the end.",
             "4-3":"Good drop — don't lift back up at the end.",
             "1-2":"Almost — hold it level instead of climbing.",
             "1-4":"Almost — hold it level instead of dropping."};
function judge(c){
  const {fit,f}=fitAll(c);
  let best=1; for(const k of [2,3,4]) if(fit[k]>fit[best]) best=k;
  let s=fit[tone], action=null, gap=0;
  if(best!==tone){
    gap=fit[best]-fit[tone];
    /* Coaching is only honest when the learner actually attempted something
       resembling the target. With no target evidence at all it really was a
       different tone, and we say so rather than dressing it up. */
    const adjacent=NEIGHBOURS[tone+"-"+best] && fit[tone]>=CFG.coachFloor;
    if(adjacent){
      if(gap>CFG.vetoHard){ s=Math.min(s,59); }
      else if(gap>CFG.vetoSoft){ s=Math.min(s,69); }
      s=Math.max(s,25);              /* never below Almost There when coaching */
      action="coach";
    } else {
      if(gap>CFG.vetoHard){ s=Math.min(s,24); action="veto"; }
      else if(gap>CFG.vetoSoft){ s=Math.min(s,59); action="veto"; }
    }
  }
  return {score:Math.round(s),fit:fit,f:f,range:f.range,best:best,gap:Math.round(gap),action:action};
}
const bandOf=s=>BANDS.findIndex(b=>s>=b.min);

/* two-syllable helpers — energy only, the tone rules are untouched */
function energyEnvelope(x,sr){
  const win=Math.round(sr*0.02), out=[];
  for(let i=0;i+win<x.length;i+=win){ let e=0;
    for(let k=0;k<win;k++) e+=x[i+k]*x[i+k];
    out.push(Math.sqrt(e/win)); }
  return out;
}
function countSyllables(x,sr,floor){
  const env=energyEnvelope(x,sr), gate=Math.max(floor*Math.pow(10,CFG.gateDb/20),0.0012);
  let n=0,on=false,run=0;
  for(const v of env){
    if(v>gate*1.4){ if(!on){run=0;} on=true; run++; }
    else { if(on&&run>=3) n++; on=false; run=0; }
  }
  if(on&&run>=3) n++;
  return Math.max(1,n);
}
function firstSyllable(raw){
  /* keep frames up to the first voiced gap of >=90 ms */
  const out=[]; let seen=false,gap=0;
  for(const p of raw){
    if(p.f0){ if(gap>=90&&seen) break; seen=true; gap=0; out.push(p); }
    else { if(seen) gap+=10; out.push(p); }
  }
  return out;
}

/* ---------------- attempt flow ---------------- */
let rid=0,floorRms=0.002,recT0=0,lastVoice=0,voiceMs=0;

async function turn(){
  if(stage==="recording") return finish();
  stopAll(); els.verdict.classList.remove("show");
  try{ await getMic(); }catch(e){ toast("Microphone blocked — check permissions."); return; }
  stage="listening"; listen(true,()=>countIn());
}
async function countIn(){
  stage="counting";
  await startCapture();               /* capture starts NOW: the count-in is our room tone */
  let n=3; els.count.textContent=n; els.count.classList.add("show"); cue("Get ready");
  const iv=setInterval(()=>{ n--;
    if(n===0){ clearInterval(iv); els.count.classList.remove("show"); begin(); }
    else els.count.textContent=n; },620);
}
function begin(){
  /* room floor from everything captured during the count-in */
  const room=flat(0,pcmLen);
  floorRms=Math.max(0.0006,rmsOf(room.subarray(Math.floor(room.length*0.25))));
  attemptStart=pcmLen;
  recT0=performance.now(); lastVoice=0; voiceMs=0;
  stage="recording";
  els.recBtn.innerHTML='<span class="dot"></span>Done';
  els.listenBtn.disabled=true; els.level.classList.add("show");
  cue("Fly it yourself");
  anim={teacher:teacherPerf,child:null,t0:performance.now(),holdMs:1e9};
  let seen=attemptStart;
  const gate=floorRms*Math.pow(10,CFG.gateDb/20);
  const step=()=>{
    if(stage!=="recording") return;
    const t=performance.now()-recT0;
    if(pcmLen>seen){
      const r=rmsOf(flat(seen,pcmLen)); seen=pcmLen;
      els.levelBar.style.width=Math.min(100,(r/Math.max(gate,1e-6))*40)+"%";
      if(r>gate){ lastVoice=t; voiceMs+=16; }
    }
    if(t>CFG.maxMs||(voiceMs>200&&lastVoice&&t-lastVoice>CFG.silenceMs)) return finish();
    rid=requestAnimationFrame(step);
  };
  rid=requestAnimationFrame(step);
}
function finish(){
  if(stage!=="recording") return;
  cancelAnimationFrame(rid); stage="done"; anim=null;
  els.recBtn.innerHTML='<span class="dot"></span>Try again';
  els.listenBtn.disabled=false; els.cue.classList.remove("show"); els.level.classList.remove("show");
  const audioF32=flat(attemptStart,pcmLen);
  stopCapture();

  const raw=trackOffline(audioF32,recSR,floorRms);
  /* For the pair we split on the quiet between the syllables. The frozen
     tone rule judges the first syllable; the second must simply be there,
     light and short. No new tone recognition was added. */
  let syls=1;
  if(id==="PAIR") syls=countSyllables(audioF32,recSR,floorRms);
  const a=analyse(id==="PAIR"?firstSyllable(raw):raw);
  const wav=toWav(audioF32,recSR);
  if(learnerAudio) URL.revokeObjectURL(learnerAudio);
  learnerAudio=URL.createObjectURL(new Blob([wav],{type:"audio/wav"}));

  if(!a){
    result=null; setChips();
    els.hint.textContent="Didn't quite catch that — have another go.";
    lastDebug="no usable pitch\nfloor "+floorRms.toFixed(4)+"  gate +"+CFG.gateDb+" dB\nframes "+raw.length;
    record(wav,null,null); return;
  }
  const j=judge(a.c);
  let sc=j.score, act=j.action;
  if(id==="PAIR"&&syls<2){ sc=Math.min(sc,45); act="pair"; }
  result={score:sc,band:bandOf(sc),action:act,best:j.best,syllables:syls};
  els.hint.textContent=HINT[tone];
  lastDebug="score "+j.score+"  band "+BANDS[result.band].name
    +"\nfit  T1 "+Math.round(j.fit[1])+"  T2 "+Math.round(j.fit[2])
    +"  T3 "+Math.round(j.fit[3])+"  T4 "+Math.round(j.fit[4])
    +"\nbest T"+j.best+(j.action?("  "+j.action.toUpperCase()+" gap "+j.gap):"")
    +"\ndip "+j.f.earlyFall.toFixed(1)+" st  min@"+j.f.minPos.toFixed(2)
    +"  recovery "+j.f.recovery.toFixed(1)+" st"
    +"\nrange "+j.range.toFixed(2)+" st   dur "+Math.round(a.durMs)+" ms"
    +"\nbaseline "+a.baselineHz+" Hz   voiced "+a.coverage+"%"
    +"\nfloor "+floorRms.toFixed(4)+"  gate +"+CFG.gateDb+" dB";
  showResult(true); setChips();
  record(wav,a,j);
}
els.recBtn.onclick=turn;

function showResult(auto){
  if(!result) return;
  const b=BANDS[result.band];
  els.vband.textContent=b.name; els.vband.style.color=b.color;
  els.vmsg.textContent = result.action==="pair"
  ? "Say both halves — 妈妈."
  : result.action
    ? (COACH[tone+"-"+result.best] || "That sounded like a different tone.")
    : MSG[tone][result.band];
  els.verdict.classList.add("show");
  const seed=(result.band+1)*1.7+tone;
  const child=choreograph(route,result.band,seed);
  anim={teacher:teacherPerf,
        child:{perf:child,lag:PERF[result.band].lagMs,gap:PERF[result.band].gapSt,color:b.color},
        t0:performance.now()+(auto?280:0),holdMs:900};
}
function setChips(){ $("cMine").disabled=!learnerAudio; $("cFlight").disabled=!result; }
$("cTeacher").onclick=()=>{ stopAll(); playNative(); cue("Teacher",1400); };
$("cMine").onclick=()=>{ stopAll(); playMine(); cue("Your voice",1400); };
$("cFlight").onclick=()=>{ stopAll(); showResult(false); };
let ael=null;
function playMine(){ if(!learnerAudio) return; if(!ael) ael=new Audio();
  ael.src=learnerAudio; ael.currentTime=0; ael.play().catch(()=>{}); }
function stopAll(){ stopNative(); if(ael) ael.pause(); anim=null; }

/* ==================================================================
   Developer capture mode
   ================================================================== */
function b64enc(buf){ const u=new Uint8Array(buf); let s="";
  for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return btoa(s); }
function record(wav,a,j){
  if(!dev) return;
  capture.push({
    n:capture.length+1, utc:new Date().toISOString(),
    target_tone:tone, character:ASSETS[id].ch, intended_quality:intended,
    sample_rate:recSR, duration_s:+(wav.byteLength-44)/2/recSR,
    settings:{gate_db:CFG.gateDb,silence_ms:CFG.silenceMs,head_trim_ms:CFG.headTrimMs,
              tail_trim_ms:CFG.tailTrimMs,f0_min:CFG.f0Min,f0_max:CFG.f0Max,clarity:CFG.clarity},
    measurements:a?{contour_st:a.c.map(x=>+x.toFixed(2)),range_st:+j.range.toFixed(2),
              duration_ms:Math.round(a.durMs),frames:a.frames,baseline_hz:a.baselineHz,
              voiced_pct:a.coverage,room_floor_rms:+floorRms.toFixed(5)}:null,
    fit:j?{1:Math.round(j.fit[1]),2:Math.round(j.fit[2]),3:Math.round(j.fit[3]),4:Math.round(j.fit[4]),
           best_tone:j.best,gap:j.gap,action:j.action}:null,
    tone3_evidence:j?{early_st:+j.f.early.toFixed(2),late_st:+j.f.late.toFixed(2),
           min_st:+j.f.min.toFixed(2),min_position:+j.f.minPos.toFixed(3),
           dip_depth_st:+j.f.earlyFall.toFixed(2),recovery_st:+j.f.recovery.toFixed(2),
           net_st:+j.f.net.toFixed(2),range_st:+j.f.range.toFixed(2)}:null,
    trim:{mode:"fixed",head_trim_ms:CFG.headTrimMs,tail_trim_ms:CFG.tailTrimMs,
          note:"adaptive trim tested offline on the 80-attempt corpus and rejected: it cost 20 points of accuracy"},
    result:j?{score:j.score,band:BANDS[bandOf(j.score)].name}:{score:null,band:"NO SCORE"},
    wav_base64:b64enc(wav)
  });
  els.devTag.textContent="DEV "+capture.length;
}
function download(blob,name){ const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000); }

let taps=0,tapT=0;
els.title.onclick=()=>{ const n=Date.now();
  taps=(n-tapT<800)?taps+1:1; tapT=n;
  if(taps>=5){ taps=0; dev=true; els.devTag.textContent="DEV "+capture.length; devSheet(); } };
els.devTag.onclick=()=>{ if(dev) devSheet(); };

function devSheet(){
  const sh=document.createElement("div"); sh.className="sheet";
  const bytes=capture.reduce((s,c)=>s+c.wav_base64.length,0);
  sh.innerHTML=
   '<div class="sheet-in">'
   +'<h2>Developer</h2>'
   +'<div><span class="lab">Mic sensitivity</span><span class="val" id="vGate">+'+CFG.gateDb+' dB over room</span>'
   +'<input type="range" id="sGate" min="2" max="16" step="0.5" value="'+CFG.gateDb+'"></div>'
   +'<div><span class="lab">Silence timeout</span><span class="val" id="vSil">'+CFG.silenceMs+' ms</span>'
   +'<input type="range" id="sSil" min="300" max="1600" step="50" value="'+CFG.silenceMs+'"></div>'
   +'<div><span class="lab">Intended quality (next attempt)</span>'
   +'<div class="seg" id="segQ"><button data-q="correct">Correct</button><button data-q="almost">Almost</button><button data-q="wrong">Wrong</button></div></div>'
   +'<div class="lab">Last attempt</div><div class="dbg">'+(lastDebug||"—")+'</div>'
   +'<button class="big" id="dlBtn">Export '+capture.length+' attempts ('+Math.round(bytes/1024/1024*0.75)+' MB)</button>'
   +'<button class="big ghost" id="clrBtn">Clear captures</button>'
   +'<button class="big ghost" id="closeBtn">Close</button></div>';
  document.body.appendChild(sh);
  const q=sh.querySelector("#segQ");
  [...q.children].forEach(b=>{ b.setAttribute("aria-pressed",b.dataset.q===intended);
    b.onclick=()=>{ intended=b.dataset.q; [...q.children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.q===intended)); }; });
  sh.querySelector("#sGate").oninput=e=>{ CFG.gateDb=+e.target.value; sh.querySelector("#vGate").textContent="+"+CFG.gateDb+" dB over room"; };
  sh.querySelector("#sSil").oninput=e=>{ CFG.silenceMs=+e.target.value; sh.querySelector("#vSil").textContent=CFG.silenceMs+" ms"; };
  sh.querySelector("#dlBtn").onclick=()=>{
    if(!capture.length) return toast("Nothing captured yet");
    const doc={schema:"fa-calibration-1",tool:"flight-academy-demo-v4",
      exported_utc:new Date().toISOString(),count:capture.length,attempts:capture};
    download(new Blob([JSON.stringify(doc)],{type:"application/json"}),
      "fa_calibration_"+new Date().toISOString().replace(/[:.]/g,"").slice(0,15)+".json");
  };
  sh.querySelector("#clrBtn").onclick=()=>{ capture=[]; els.devTag.textContent="DEV 0"; sh.remove(); };
  sh.querySelector("#closeBtn").onclick=()=>sh.remove();
  sh.onclick=e=>{ if(e.target===sh) sh.remove(); };
}

let tt=0;
function toast(m){ els.toast.textContent=m; els.toast.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>els.toast.classList.remove("show"),2600); }
window.addEventListener("resize",()=>{ if(stage!=="menu") sizeField(); cards(); });
els.mumArt.src="data:image/png;base64,"+ART.huahua;
els.sky.appendChild(els.mumArt);
document.addEventListener("gesturestart",e=>e.preventDefault());
cards();
</script>
</body>
</html>
